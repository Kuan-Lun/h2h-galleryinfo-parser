name: Publish to PyPI

on:
  push:
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install version parser
        run: python -m pip install --upgrade packaging

      - name: Check version bump
        id: version
        run: |
          CURRENT=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          PREVIOUS=$(git show HEAD~1:pyproject.toml | python -c "
          import tomllib, sys
          print(tomllib.load(sys.stdin.buffer)['project']['version'])
          ")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            python -c "
          from packaging.version import Version
          current, previous = Version('$CURRENT'), Version('$PREVIOUS')
          exit(0 if current > previous else 1)
          "
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distributions
        if: steps.version.outputs.bumped == 'true'
        run: python -m pip install build && python -m build

      - name: Smoke-test wheel
        if: steps.version.outputs.bumped == 'true'
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install --force-reinstall "$WHEEL"
          python -c "import h2h_galleryinfo_parser"

      - name: Publish
        if: steps.version.outputs.bumped == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
