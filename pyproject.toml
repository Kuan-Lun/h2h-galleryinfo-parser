[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "h2h-galleryinfo-parser"
version = "0.5.3"
description = "A simple H@H GalleryInfo Parser"
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "hatchling>=1.32.0",
    "mypy>=2.3.1",
    "packaging>=26.0",
    "pytest>=9.0.2",
    "ruff>=0.16.4",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/h2h-galleryinfo-parser"
Source = "https://github.com/Kuan-Lun/h2h-galleryinfo-parser"
Tracker = "https://github.com/Kuan-Lun/h2h-galleryinfo-parser/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/h2h_galleryinfo_parser"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.h2h.version]
release-paths = ["LICENSE", "src/**"]
